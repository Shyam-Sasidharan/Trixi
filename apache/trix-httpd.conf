# Apache 2.4 VirtualHost Configuration for TRIXI Multiplayer Socket.IO Server
# Ensure mod_proxy, mod_proxy_http, mod_proxy_wstunnel, and mod_rewrite are enabled:
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#   LoadModule rewrite_module modules/mod_rewrite.so

<VirtualHost *:80>
    ServerName api.trixi.game
    ServerAdmin webmaster@trixi.game

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName api.trixi.game
    ServerAdmin webmaster@trixi.game

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/trixi_cert.pem
    SSLCertificateKeyFile /etc/ssl/private/trixi_key.pem

    # Enable HTTP KeepAlive
    KeepAlive On
    MaxKeepAliveRequests 100
    KeepAliveTimeout 65

    # Reverse Proxy Setup
    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    # WebSocket Upgrade Tunneling for Socket.IO
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:3000/socket.io/$1 [P,L]

    # HTTP Long-Polling Fallback & REST API Proxies
    ProxyPass /socket.io/ http://127.0.0.1:3000/socket.io/ retry=0 timeout=300
    ProxyPassReverse /socket.io/ http://127.0.0.1:3000/socket.io/

    ProxyPass / http://127.0.0.1:3000/ timeout=60
    ProxyPassReverse / http://127.0.0.1:3000/

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    ErrorLog ${APACHE_LOG_DIR}/trix_error.log
    CustomLog ${APACHE_LOG_DIR}/trix_access.log combined
</VirtualHost>

